name: Atualizar REDSEC

on:
  workflow_dispatch:
  schedule:
    - cron: "31 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar catálogo REDSEC
        run: |
          python -c "import json; print('REDSEC catalog:', len(json.load(open('data/weapons.json', encoding='utf-8'))['weapons']), 'armas')"
